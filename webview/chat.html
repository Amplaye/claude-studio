<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="{{csp}}" />
    <link rel="stylesheet" href="{{tokensCss}}" />
    <link rel="stylesheet" href="{{motionCss}}" />
    <link rel="stylesheet" href="{{contextCss}}" />
    <link rel="stylesheet" href="{{chatCss}}" />
    <title>Claude Studio</title>
  </head>
  <body>
    {{sprite}}

    <div class="shell">
      <div class="chatcol">
        <header class="top">
          <span class="brand"><svg class="ico"><use href="#ion-sparkles" /></svg>Studio</span>
          <span class="grow"></span>
          <div class="modeseg" id="mode" title="How it handles permissions (Alt+M)">
            <button class="modeseg-btn" data-mode="plan" title="Plan only: it thinks but touches nothing">
              <svg class="ico"><use href="#ion-list" /></svg><span>Plan</span>
            </button>
            <button class="modeseg-btn" data-mode="default" title="Asks before acting">
              <svg class="ico"><use href="#ion-shield-checkmark" /></svg><span>Ask</span>
            </button>
            <button class="modeseg-btn yolo" data-mode="bypassPermissions" title="Never asks: does everything on its own">
              <svg class="ico"><use href="#ion-flash" /></svg><span>Yolo</span>
            </button>
          </div>
          <button class="iconbtn" id="btnCfg" title="Model, thinking and notifications (Alt+I)">
            <svg class="ico"><use href="#ion-options" /></svg>
          </button>
          <button class="iconbtn" id="btnHistory" title="Conversations in this project (Alt+H)">
            <svg class="ico"><use href="#ion-time" /></svg>
          </button>
          <button class="iconbtn" id="btnCtx" title="Show or hide the context (Alt+C)" hidden>
            <svg class="ico"><use href="#ion-speedometer" /></svg>
          </button>
          <button class="iconbtn" id="btnTab" title="Open as a tab">
            <svg class="ico"><use href="#ion-open" /></svg>
          </button>
          <button class="iconbtn" id="btnNew" title="New session (Alt+N)">
            <svg class="ico"><use href="#ion-add" /></svg>
          </button>
          <!-- Tab only: closes this one, with its own exit animation. -->
          <button class="iconbtn" id="btnClose" title="Close this tab (Alt+W)" hidden>
            <svg class="ico"><use href="#ion-close" /></svg>
          </button>
        </header>

        <div class="drawer" id="drawer" hidden>
          <div class="drawer-head">
            <span>Conversations</span>
            <button class="iconbtn" id="drawerClose" title="Close">
              <svg class="ico"><use href="#ion-close" /></svg>
            </button>
          </div>
          <div class="drawer-list" id="drawerList"></div>
        </div>

        <!-- The choices that shape how Claude works and how it tells you
             when it's done. They survive from one window to the next. -->
        <div class="pop" id="cfg" hidden>
          <div class="pop-head">
            <span>Settings</span>
            <button class="iconbtn" id="cfgClose" title="Close">
              <svg class="ico"><use href="#ion-close" /></svg>
            </button>
          </div>

          <div class="pop-sec">Model</div>
          <div class="model-list" id="cfgModelList">
            <!-- the model cards are built by the JS -->
          </div>

          <div class="pop-sec">Effort</div>
          <div class="seg" id="cfgEffort">
            <!-- the buttons are built by the JS based on the chosen model -->
          </div>
          <p class="phint" id="cfgEffortHint"></p>

          <div class="pop-sec">Thinking</div>
          <div class="seg" id="cfgThink">
            <!-- Auto / On / Off -->
          </div>
          <p class="phint" id="cfgThinkHint"></p>

          <div class="pop-sec">When it's done</div>
          <label class="prow">
            <span class="plab">Sound</span>
            <select id="cfgSound">
              <option value="cozy">Cozy</option>
              <option value="harvest">Harvest</option>
              <option value="levelup">Level up</option>
              <option value="starlit">Starlit</option>
              <option value="chest">Chest</option>
              <option value="off">Mute</option>
            </select>
          </label>
          <label class="prow">
            <span class="plab">Volume</span>
            <input type="range" id="cfgVol" min="0" max="100" step="5" />
          </label>
          <label class="pcheck">
            <input type="checkbox" id="cfgAway" />
            <span>Only when VS Code isn't in front</span>
          </label>
          <label class="pcheck">
            <input type="checkbox" id="cfgAsk" />
            <span>Also chime when a permission is needed</span>
          </label>
          <label class="pcheck">
            <input type="checkbox" id="cfgToast" />
            <span>VS Code notification when you're away</span>
          </label>
          <button class="pbtn" id="cfgTest" type="button">
            <svg class="ico"><use href="#ion-play" /></svg>Test the sound
          </button>
        </div>

        <main class="log" id="log"></main>

        <form class="composer" id="composer">
          <div class="menu" id="menu" hidden></div>
          <div class="attach" id="attach" hidden></div>
          <textarea id="input" rows="1" placeholder="Message Claude…  (@ for a file, / for a command, Enter to send)"></textarea>
          <button class="send" id="send" type="submit" title="Send">
            <svg class="ico send-arrow"><use href="#ion-navigate" /></svg>
          </button>
        </form>
      </div>

      <!-- In the full-screen tab the context sits right here alongside: in the
           sidebar it has a panel of its own, but in a tab that isn't there. -->
      <aside class="rail" id="rail"></aside>
    </div>

    <script nonce="{{nonce}}" src="{{ctxpanelJs}}"></script>
    <script nonce="{{nonce}}" src="{{chimeJs}}"></script>
    <script nonce="{{nonce}}" src="{{chatJs}}"></script>
  </body>
</html>
