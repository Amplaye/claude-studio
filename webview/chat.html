<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="{{csp}}" />
    <link rel="stylesheet" href="{{tokensCss}}" />
    <link rel="stylesheet" href="{{motionCss}}" />
    <link rel="stylesheet" href="{{contextCss}}" />
    <link rel="stylesheet" href="{{chatCss}}" />
    <title>Claude Studio</title>
  </head>
  <body>
    {{sprite}}

    <div class="shell">
      <div class="chatcol">
        <header class="top">
          <span class="brand"><svg class="ico"><use href="#ion-sparkles" /></svg>Studio</span>
          <span class="grow"></span>
          <div class="modeseg" id="mode" title="Come si comporta coi permessi (Alt+M)">
            <button class="modeseg-btn" data-mode="plan" title="Solo piano: ragiona ma non tocca niente">
              <svg class="ico"><use href="#ion-list" /></svg><span>Piano</span>
            </button>
            <button class="modeseg-btn" data-mode="default" title="Chiede prima di agire">
              <svg class="ico"><use href="#ion-shield-checkmark" /></svg><span>Chiede</span>
            </button>
            <button class="modeseg-btn yolo" data-mode="bypassPermissions" title="Non chiede: fa tutto da solo">
              <svg class="ico"><use href="#ion-flash" /></svg><span>Yolo</span>
            </button>
          </div>
          <button class="iconbtn" id="btnCfg" title="Modello, pensiero e avvisi (Alt+I)">
            <svg class="ico"><use href="#ion-options" /></svg>
          </button>
          <button class="iconbtn" id="btnHistory" title="Conversazioni di questo progetto (Alt+H)">
            <svg class="ico"><use href="#ion-time" /></svg>
          </button>
          <button class="iconbtn" id="btnCtx" title="Mostra o nascondi il contesto (Alt+C)" hidden>
            <svg class="ico"><use href="#ion-speedometer" /></svg>
          </button>
          <button class="iconbtn" id="btnTab" title="Apri come scheda">
            <svg class="ico"><use href="#ion-open" /></svg>
          </button>
          <button class="iconbtn" id="btnNew" title="Nuova sessione (Alt+N)">
            <svg class="ico"><use href="#ion-add" /></svg>
          </button>
        </header>

        <div class="drawer" id="drawer" hidden>
          <div class="drawer-head">
            <span>Conversazioni</span>
            <button class="iconbtn" id="drawerClose" title="Chiudi">
              <svg class="ico"><use href="#ion-close" /></svg>
            </button>
          </div>
          <div class="drawer-list" id="drawerList"></div>
        </div>

        <!-- Le scelte che valgono per come lavora Claude e per come te lo dice
             quando ha finito. Restano fra una finestra e l'altra. -->
        <div class="pop" id="cfg" hidden>
          <div class="pop-head">
            <span>Impostazioni</span>
            <button class="iconbtn" id="cfgClose" title="Chiudi">
              <svg class="ico"><use href="#ion-close" /></svg>
            </button>
          </div>

          <div class="pop-sec">Modello</div>
          <div class="model-list" id="cfgModelList">
            <!-- le card dei modelli le costruisce il JS -->
          </div>

          <div class="pop-sec">Impegno</div>
          <div class="seg" id="cfgEffort">
            <!-- i bottoni li costruisce il JS in base al modello scelto -->
          </div>
          <p class="phint" id="cfgEffortHint"></p>

          <div class="pop-sec">Pensiero</div>
          <div class="seg" id="cfgThink">
            <!-- Auto / Acceso / Spento -->
          </div>
          <p class="phint" id="cfgThinkHint"></p>

          <div class="pop-sec">Quando ha finito</div>
          <label class="prow">
            <span class="plab">Suono</span>
            <select id="cfgSound">
              <option value="cozy">Coccola</option>
              <option value="harvest">Raccolto</option>
              <option value="levelup">Level up</option>
              <option value="starlit">Stellina</option>
              <option value="chest">Forziere</option>
              <option value="off">Muto</option>
            </select>
          </label>
          <label class="prow">
            <span class="plab">Volume</span>
            <input type="range" id="cfgVol" min="0" max="100" step="5" />
          </label>
          <label class="pcheck">
            <input type="checkbox" id="cfgAway" />
            <span>Solo se VSCode non e' in primo piano</span>
          </label>
          <label class="pcheck">
            <input type="checkbox" id="cfgAsk" />
            <span>Suona anche quando serve un permesso</span>
          </label>
          <label class="pcheck">
            <input type="checkbox" id="cfgToast" />
            <span>Avviso di VSCode se sei altrove</span>
          </label>
          <button class="pbtn" id="cfgTest" type="button">
            <svg class="ico"><use href="#ion-play" /></svg>Prova il suono
          </button>
        </div>

        <main class="log" id="log"></main>

        <form class="composer" id="composer">
          <div class="menu" id="menu" hidden></div>
          <div class="attach" id="attach" hidden></div>
          <textarea id="input" rows="1" placeholder="Scrivi a Claude…  (@ per un file, / per un comando, Invio manda)"></textarea>
          <button class="send" id="send" type="submit" title="Manda">
            <svg class="ico send-arrow" viewBox="0 0 24 24"><path d="M5 12h12m0 0l-5-5.5m5 5.5l-5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
      </div>

      <!-- Da scheda a tutto schermo il contesto sta qui di fianco: nella barra
           laterale ha un pannello suo, ma in una scheda quello non c'e'. -->
      <aside class="rail" id="rail"></aside>
    </div>

    <script nonce="{{nonce}}" src="{{ctxpanelJs}}"></script>
    <script nonce="{{nonce}}" src="{{chimeJs}}"></script>
    <script nonce="{{nonce}}" src="{{chatJs}}"></script>
  </body>
</html>
