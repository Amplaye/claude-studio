<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="{{csp}}" />
    <link rel="stylesheet" href="{{tokensCss}}" />
    <link rel="stylesheet" href="{{motionCss}}" />
    <link rel="stylesheet" href="{{contextCss}}" />
    <link rel="stylesheet" href="{{tasksCss}}" />
    <link rel="stylesheet" href="{{chatCss}}" />
    <link rel="stylesheet" href="{{officeCss}}" />
    <title>Claude Studio</title>
  </head>
  <body>
    {{sprite}}

    <div class="shell">
      <div class="chatcol">
        <header class="top">
          <!-- The wordmark is in a span of its own so it can step aside: in the
               narrow face, while Claude works, the room it takes is worth more to
               the activity pill than to a name you've already read. -->
          <span class="brand"><svg class="ico"><use href="#ion-sparkles" /></svg><span class="brand-t">Studio</span></span>
          <span class="grow"></span>
          <!-- What it's doing right now, next to the mode switch: short on purpose —
               the state and the clock, nothing else. A chat that stays still for a
               minute while a tool works looks stuck otherwise. -->
          <div class="activity" id="activity" hidden>
            <span class="act-orb"></span>
            <span class="act-what" id="actWhat"></span>
            <span class="act-time" id="actTime">0:00</span>
          </div>
          <div class="modeseg" id="mode" data-i18n-title="top.mode" title="How it handles permissions (Alt+M)">
            <button class="modeseg-btn" data-mode="plan" data-i18n-title="top.mode.plan" title="Plan only: it thinks but touches nothing">
              <svg class="ico"><use href="#ion-list" /></svg><span data-i18n="top.mode.plan.label">Plan</span>
            </button>
            <button class="modeseg-btn" data-mode="default" data-i18n-title="top.mode.ask" title="Asks before acting">
              <svg class="ico"><use href="#ion-shield-checkmark" /></svg><span data-i18n="top.mode.ask.label">Ask</span>
            </button>
            <button class="modeseg-btn yolo" data-mode="bypassPermissions" data-i18n-title="top.mode.yolo" title="Never asks: does everything on its own">
              <svg class="ico"><use href="#ion-flash" /></svg><span data-i18n="top.mode.yolo.label">Yolo</span>
            </button>
          </div>
          <button class="iconbtn" id="btnCfg" data-i18n-title="top.settings" title="Model, thinking and notifications (Alt+I)">
            <svg class="ico"><use href="#ion-options" /></svg>
          </button>
          <button class="iconbtn" id="btnHistory" data-i18n-title="top.history" title="Conversations in this project (Alt+H)">
            <svg class="ico"><use href="#ion-time" /></svg>
          </button>
          <button class="iconbtn" id="btnCtx" data-i18n-title="top.context" title="Show or hide the context (Alt+C)" hidden>
            <svg class="ico"><use href="#ion-speedometer" /></svg>
          </button>
          <!-- L'ufficio. Sta qui e non fra i bottoni della testata di VS Code perche'
               quelli esistono solo per i pannelli della barra laterale: chi lavora
               nella scheda a tutto schermo non li vede mai, ed e' proprio chi
               guarderebbe l'ufficio. -->
          <button class="iconbtn" id="btnOffice" data-i18n-title="top.office" title="The office" hidden>
            <svg class="ico"><use href="#ion-people" /></svg>
          </button>
          <button class="iconbtn" id="btnTab" data-i18n-title="top.tab" title="Open as a tab">
            <svg class="ico"><use href="#ion-open" /></svg>
          </button>
          <button class="iconbtn" id="btnNew" data-i18n-title="top.new" title="New session in a new tab (Alt+N)">
            <svg class="ico"><use href="#ion-add" /></svg>
          </button>
        </header>

        <div class="drawer" id="drawer" hidden>
          <div class="drawer-head">
            <span data-i18n="drawer.title">Conversations</span>
            <button class="iconbtn" id="drawerClose" data-i18n-title="common.close" title="Close">
              <svg class="ico"><use href="#ion-close" /></svg>
            </button>
          </div>
          <div class="drawer-list" id="drawerList"></div>
        </div>

        <!-- The choices that shape how Claude works and how it tells you
             when it's done. They survive from one window to the next. -->
        <div class="pop" id="cfg" hidden>
          <div class="pop-head">
            <span data-i18n="cfg.title">Settings</span>
            <button class="iconbtn" id="cfgClose" data-i18n-title="common.close" title="Close">
              <svg class="ico"><use href="#ion-close" /></svg>
            </button>
          </div>

          <div class="pop-sec" data-i18n="cfg.model">Model</div>
          <div class="model-list" id="cfgModelList">
            <!-- the model cards are built by the JS -->
          </div>

          <div class="pop-sec" data-i18n="cfg.effort">Effort</div>
          <div class="seg" id="cfgEffort">
            <!-- the buttons are built by the JS based on the chosen model -->
          </div>
          <p class="phint" id="cfgEffortHint"></p>

          <div class="pop-sec" data-i18n="cfg.thinking">Thinking</div>
          <div class="seg" id="cfgThink">
            <!-- Auto / On / Off -->
          </div>
          <p class="phint" id="cfgThinkHint"></p>

          <!-- The language of the interface. It sits above the sounds because it
               changes everything below it, this panel included, on the spot. -->
          <div class="pop-sec" data-i18n="cfg.language">Language</div>
          <div class="seg" id="cfgLang">
            <!-- EN / IT, built by the JS -->
          </div>
          <p class="phint" data-i18n="cfg.language.hint">Changes the whole interface straight away</p>

          <!-- Le due cose che l'estensione fa da se' mentre Claude lavora. Stanno
               sopra i suoni perche' cambiano quello che succede, non come te lo si
               dice, e perche' una cosa che parte da sola deve avere il suo
               interruttore dove lo trovi. -->
          <div class="pop-sec" data-i18n="cfg.auto">While it works</div>
          <label class="pcheck">
            <input type="checkbox" id="cfgFollow" />
            <span data-i18n="cfg.follow">The editor follows it: files open and the changed lines light up</span>
          </label>
          <label class="pcheck">
            <input type="checkbox" id="cfgAutofix" />
            <span data-i18n="cfg.autofix">Fix on its own the errors it introduces (at most twice)</span>
          </label>

          <div class="pop-sec" data-i18n="cfg.done">When it's done</div>
          <!-- The list of sounds isn't a <select> any more: that one opens a menu
               drawn by the operating system, in the middle of a panel where
               everything else slides. The button and the list are built by the JS
               (makeSelect) — one option per sound, each with its own icon. -->
          <div class="prow">
            <span class="plab" data-i18n="cfg.sound">Sound</span>
            <div class="sel" id="cfgSound"></div>
          </div>
          <label class="prow">
            <span class="plab" data-i18n="cfg.volume">Volume</span>
            <input type="range" id="cfgVol" min="0" max="100" step="5" />
          </label>
          <label class="pcheck">
            <input type="checkbox" id="cfgAway" />
            <span data-i18n="cfg.away">Only when VS Code isn't in front</span>
          </label>
          <label class="pcheck">
            <input type="checkbox" id="cfgAsk" />
            <span data-i18n="cfg.onAsk">Also chime when a permission is needed</span>
          </label>
          <label class="pcheck">
            <input type="checkbox" id="cfgToast" />
            <span data-i18n="cfg.toast">VS Code notification when you're away</span>
          </label>
          <button class="pbtn" id="cfgTest" type="button">
            <svg class="ico"><use href="#ion-play" /></svg><span data-i18n="cfg.test">Test the sound</span>
          </button>
        </div>

        <!-- Quello che hai scritto mentre Claude lavorava. Non entra nel discorso
             finche' non parte davvero: sta in alto a sinistra, sopra il discorso e
             fuori dalla barra di scrittura, perche' e' una cosa che aspetta e non
             una cosa detta. Qui c'e' scritto cosa aspetta e quando partira', in che
             ordine, e con cosa — le immagini e i file che si porta dietro si vedono
             qui come si vedranno nel discorso. La × lo ritira finche' e' ancora in
             tempo, e il testo torna nel campo. -->
        <div class="queued" id="queued" role="region" data-i18n-label="queue.title" aria-label="Messages waiting to be sent" hidden></div>

        <main class="log" id="log" role="log"></main>

        <!-- What a screen reader is told, and the only thing it is told.
             Announcing the thread itself would read every streamed token out loud;
             this says the one line the activity pill says — "Reading src/store.ts",
             "Permission needed: Bash" — and only when it changes. -->
        <p class="sr-only" id="say" role="status" aria-live="polite" aria-atomic="true"></p>

        <form class="composer" id="composer">
          <div class="menu" id="menu" hidden></div>
          <div class="attach" id="attach" hidden></div>
          <textarea id="input" rows="1" data-i18n-ph="composer.placeholder" placeholder="Message Claude…  (@ for a file, / for a command, Enter to send)"></textarea>
          <!-- Attachments. The picker is VS Code's own and it filters nothing:
               a PDF, a spreadsheet, a zip, a video — whatever is on the disk can
               come into the message. Images travel as images; everything else
               travels as a path Claude opens with its own tools. -->
          <button class="clip" id="btnAttach" type="button" data-i18n-title="composer.attach" title="Attach files (any kind)">
            <svg class="ico"><use href="#ion-attach" /></svg>
          </button>
          <!-- Not a submit button: while Claude is working this is Stop, and Enter
               must stay Enter — it queues the next message instead of interrupting. -->
          <!-- The arrow is drawn by the JS (chat.js, sendArrow): built symmetrical
               inside its box, so it sits in the middle of the button by
               construction instead of being nudged there. -->
          <button class="send" id="send" type="button" title="Send"></button>
        </form>
      </div>

      <!-- In the full-screen tab the context sits right here alongside: in the
           sidebar it has a panel of its own, but in a tab that isn't there. -->
      <aside class="rail" id="rail"></aside>
    </div>

    <!-- L'altra faccia della stessa scheda: la pianta dell'ufficio, con una persona
         per ogni conversazione aperta. Si accende al posto della chat, non accanto —
         vedi .office in office.css.

         I due fogli di sprite arrivano da qui dentro perche' il CSP non fa passare
         uno <style> scritto nella pagina, e un data-attributo e' la strada che resta
         per far arrivare un URI della webview al foglio di stile. -->
    <div class="office" id="office" data-room="{{roomPng}}" data-folk="{{folkPng}}"></div>

    <!-- i18n first: everything after it draws in the chosen language from the
         very first frame, instead of flashing English and then correcting itself. -->
    <script nonce="{{nonce}}" src="{{i18nJs}}"></script>
    <!-- Prima di ctxpanel: la colonna monta la lista dei passi sotto l'ultima card. -->
    <script nonce="{{nonce}}" src="{{taskspanelJs}}"></script>
    <script nonce="{{nonce}}" src="{{ctxpanelJs}}"></script>
    <script nonce="{{nonce}}" src="{{chimeJs}}"></script>
    <!-- Prima di chat.js, che lo monta appena sa di essere in una scheda. -->
    <script nonce="{{nonce}}" src="{{officeJs}}"></script>
    <script nonce="{{nonce}}" src="{{chatJs}}"></script>
  </body>
</html>
