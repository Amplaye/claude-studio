<!doctype html>
<meta charset="utf-8" />
<title>Il campionario degli impiegati</title>
<!--
  Quarantasei semi diversi, uno per riquadro, pixel e vettoriale affiancati.

  E' la pagina su cui si giudica il generatore: se quaranta figure sembrano
  quattro, non e' buono. Il fondo e' il pavimento dell'ufficio (lo stesso oliva
  di office-drafts.html) perche' una figura si giudica dove finira' a stare,
  non su un fondo neutro che la aiuta.

  Si apre a doppio clic: niente build, niente rete.
-->
<script src="skins/npc.js"></script>
<style>
  :root {
    --o50:#f6f7f4; --o100:#eaede5; --o200:#d6ddcb; --o300:#b8c6a9;
    --o700:#49563d; --o800:#3c4633; --o900:#333d2c;
    --t300:#ffa579; --s5:#FCF6ED;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 22px;
    background: #14180f; color: var(--o100);
    font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  h1 { font-size: 17px; margin: 0 0 4px; letter-spacing: .02em; }
  .lede { margin: 0 0 18px; opacity: .6; font-size: 13px; max-width: 76ch; }
  .griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 12px; }
  .scheda { background: var(--o800); border-radius: 8px; padding: 8px; }
  .coppia {
    display: flex; gap: 6px; justify-content: center; padding: 6px 0 8px;
    border-radius: 6px;
    /* il pavimento dell'ufficio, mattonelle da 16 come nella pianta */
    background-color: #b8c6a9;
    background-image:
      linear-gradient(rgba(51,61,44,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(51,61,44,.07) 1px, transparent 1px);
    background-size: 32px 32px, 32px 32px;
  }
  .coppia img { width: 64px; height: 96px; display: block; filter: drop-shadow(0 1px 0 rgba(51,61,44,.35)); }
  .coppia img.px { image-rendering: pixelated; }
  .nome { font-size: 11px; font-weight: 700; color: var(--t300); margin: 7px 0 2px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tratti { font-size: 10px; line-height: 1.35; opacity: .68; }
  .guasto { color: #ffb4a0; font-family: ui-monospace, monospace; white-space: pre-wrap; }
</style>

<h1>Il campionario degli impiegati</h1>
<p class="lede">
  A sinistra il pixel (PNG 64&times;96, quattro volte le misure logiche 16&times;24),
  a destra lo stesso seme disegnato morbido (SVG). Il fondo e' il pavimento
  dell'ufficio: e' li' che questa gente andra' a lavorare.
</p>
<div class="griglia" id="griglia"></div>

<script>
// Titoli di conversazione veri: un seme finto tipo "seed-7" nasconde proprio la
// cosa che si vuole controllare, cioe' che due nomi vicini diano due persone
// diverse.
const SEMI = [
  "Ufficio, palette", "Sito di Susan", "CRM BaliFlow", "Release 0.22",
  "Vecchia sessione", "Bug del router", "Migrazione Postgres", "Refactor del menu",
  "Sprite dell'ufficio", "Fatture di marzo", "Onboarding cliente", "Test end to end",
  "Icone della barra", "Deploy notturno", "Cache delle sessioni", "Traduzioni inglesi",
  "Webview lenta", "Grafico delle spese", "Backup del venerdi", "Ricerca full text",
  "Tema scuro", "Modale di conferma", "Import CSV", "Log di produzione",
  "Permessi utente", "Preventivo villa", "Calendario turni", "Firma dei PDF",
  "Notifiche push", "Mappa dei tavoli", "Stampa etichette", "Scorte magazzino",
  "Chat di supporto", "Analisi churn", "Riscrittura README", "Pipeline CI",
  "Token scaduti", "Editor di testi", "Scheda prodotto", "Contratto affitto",
  "Menu del bar", "Prenotazioni SPA", "Turni di sabato", "Chiusura mensile",
  "Nuovo listino", "Riunione del lunedi",
];

const VESTITO = { camicia: 'camicia', cravatta: 'camicia e cravatta', polo: 'polo',
                  cardigan: 'cardigan', giacca: 'giacca', maglione: 'maglione' };

const griglia = document.getElementById('griglia');
try {
  for (const seme of SEMI) {
    const t = NPC.traits(seme);
    const scheda = document.createElement('div');
    scheda.className = 'scheda';

    const coppia = document.createElement('div');
    coppia.className = 'coppia';
    for (const [cls, url] of [['px', NPC.sprite(seme)], ['sv', NPC.vector(seme)]]) {
      const img = document.createElement('img');
      img.className = cls;
      img.src = url;
      img.alt = seme;
      coppia.append(img);
    }

    const nome = document.createElement('div');
    nome.className = 'nome';
    nome.textContent = seme;

    const voci = [
      'pelle ' + t.pelle.nome,
      'capelli ' + t.capelli.nome + ', ' + t.taglio,
      VESTITO[t.vestito] + ' ' + t.tessuto.nome,
    ];
    if (t.vestito === 'cardigan' || t.vestito === 'giacca') voci.push('sotto ' + t.sotto.nome);
    if (t.cravatta) voci.push('cravatta ' + t.accento.nome);
    voci.push('pantaloni ' + t.pantaloni.nome);
    if (t.corporatura === 'robusta') voci.push('robusto');
    if (t.occhiali) voci.push('occhiali');
    if (t.barba !== 'no') voci.push('barba ' + t.barba);
    if (t.accessorio) voci.push(t.accessorio);

    const tratti = document.createElement('div');
    tratti.className = 'tratti';
    tratti.textContent = voci.join(' · ');

    scheda.append(coppia, nome, tratti);
    griglia.append(scheda);
  }

  // Lo stesso seme deve dare sempre la stessa persona, anche a distanza di
  // chiamate: se la cache o il caso si rompono, si vede qui e non fra sei mesi
  // dentro l'ufficio.
  const a = NPC.sprite(SEMI[0]), b = NPC.sprite(SEMI[0]);
  if (a !== b) throw new Error('stesso seme, due disegni diversi');
} catch (e) {
  const p = document.createElement('p');
  p.className = 'guasto';
  p.textContent = 'guasto: ' + (e && e.stack || e);
  document.body.append(p);
}
</script>
